name: Test, build and release

# Every push to main is tested; if the tests pass, the Android and Windows apps are built and published as
# a GitHub release (v1.0.<build number>). Both apps check the latest release and update themselves.
#
# Secrets (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_B64       the app's signing key, base64 (every update must use the same key)
#   ANDROID_KEYSTORE_PASSWORD  its password
#   SUPABASE_ACCESS_TOKEN      optional: lets this workflow deploy the vrchat-verify server function
# Variables (same page → Variables):
#   SUPABASE_PROJECT_REF       optional: the project id, for deploying the function
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - name: Database security tests
        run: node --test test/schema.test.js
      - name: Server API checks (the app's real queries through PostgREST)
        run: |
          set +e
          {
            sudo systemctl start postgresql.service &&
            sudo -u postgres env -u PGHOST -u PGUSER -u PGPASSWORD psql -qc "alter user postgres password 'postgres'" &&
            PGHOST=localhost PGUSER=postgres PGPASSWORD=postgres bash scripts/server-test.sh
          } > server-test.log 2>&1
          status=$?
          cat server-test.log
          if [ $status -ne 0 ]; then
            # Shown on the run's summary page, so the reason is visible without opening the full log.
            echo "::error title=Server API checks::$(tail -n 40 server-test.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          fi
          exit $status
      - name: VRChat verification and helper tests
        run: node --test test/vrchat.test.js test/format.test.js
      - name: Build the app (demo mode, for the click-through tests)
        run: |
          rm -f .env.production
          npm run build
      - name: Click-through UI tests
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
          node test/ui.test.mjs
      - name: Android update checks
        run: |
          mkdir -p /tmp/vd
          javac -d /tmp/vd android/src/com/snufflesboop/furzone/VerifiedDownload.java android/test/VerifiedDownloadTest.java
          java -cp /tmp/vd VerifiedDownloadTest
      - name: Windows security checks
        run: dotnet run --project desktop/test

  release:
    needs: test
    runs-on: ubuntu-24.04
    env:
      VERSION_CODE: ${{ github.run_number }}1
      GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Check the signing key is set up
        id: keys
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::ANDROID_KEYSTORE_B64 is not set, so nothing is released. See SETUP.md."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the web app
        if: steps.keys.outputs.ok == 'true'
        run: |
          npm ci
          FURZONE_VERSION="1.0.$VERSION_CODE" VITE_GITHUB_REPO="$GITHUB_REPO" npm run build
      - name: Build the Android app
        if: steps.keys.outputs.ok == 'true'
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/signing
          echo "$KEY" | base64 -d > android/signing/furzone.jks
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          AAPT2="$BT/aapt2" D8="$BT/d8" ZIPALIGN="$BT/zipalign" APKSIGNER="$BT/apksigner" bash android/build.sh
          rm -f android/signing/furzone.jks
      - name: Build the Windows app
        if: steps.keys.outputs.ok == 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis
          bash desktop/build.sh
      - name: Publish the release
        if: steps.keys.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/build/FurZone.apk FurZone.apk
          cp desktop/FurZone_Setup.exe FurZone_Setup.exe
          {
            git log -1 --format=%s "$GITHUB_SHA"
            echo
            echo "Android: download FurZone.apk on your phone. Windows: run FurZone_Setup.exe."
            echo "Already installed? The app updates itself."
            echo
            echo "sha256 FurZone.apk: $(sha256sum FurZone.apk | cut -d' ' -f1)"
            echo "sha256 FurZone_Setup.exe: $(sha256sum FurZone_Setup.exe | cut -d' ' -f1)"
          } > notes.txt
          gh release create "v1.0.$VERSION_CODE" FurZone.apk FurZone_Setup.exe \
            --title "FurZone 1.0.$VERSION_CODE" --notes-file notes.txt --latest

  vrchat-function:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Deploy the vrchat-verify server function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF not set; deploy the function by hand (SETUP.md)."
            exit 0
          fi
          npx --yes supabase@2 functions deploy vrchat-verify --project-ref "$PROJECT_REF"
